<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workshop Shop</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; background: #f5f6f8; color: #17202d; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      .shell { width: min(920px, calc(100% - 36px)); padding: 28px; }
      header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }
      h1 { margin: 0; font-size: 26px; } h2 { margin: 0 0 18px; font-size: 22px; } p { color: #657083; }
      .card { max-width: 460px; margin: 0 auto; padding: 28px; border: 1px solid #dfe3ea; border-radius: 14px; background: white; box-shadow: 0 10px 30px #17202d0d; }
      label { display: block; margin: 14px 0 6px; color: #435066; font-size: 13px; font-weight: 600; } input { width: 100%; height: 42px; box-sizing: border-box; padding: 0 12px; border: 1px solid #ccd2dd; border-radius: 7px; font-size: 14px; }
      button, a { display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 15px; border: 0; border-radius: 7px; color: white; background: #2563eb; font-weight: 700; text-decoration: none; cursor: pointer; } button { width: 100%; margin-top: 20px; }
      .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; } .product, .cart { padding: 18px; border: 1px solid #dfe3ea; border-radius: 11px; background: white; } .product h3 { margin: 0 0 8px; } .price { color: #2563eb; font-weight: 800; } .nav { display: flex; gap: 9px; } .nav a { height: 34px; padding: 0 12px; font-size: 12px; } .cart { margin-top: 20px; } [hidden] { display: none !important; } .message { min-height: 20px; color: #bd2439; font-size: 13px; }
    </style>
  </head>
  <body>
    <main class="shell">
      <header><h1>Workshop Shop</h1><nav class="nav"><a href="#products">Products</a><a href="#cart">Cart <span id="cart-count">0</span></a></nav></header>
      <section id="login-view" class="card"><h2>Sign in</h2><p>Use the synthetic workshop account.</p><form id="login-form"><label for="username">Username</label><input id="username" aria-label="Username" autocomplete="username" required /><label for="password">Password</label><input id="password" aria-label="Password" type="password" autocomplete="current-password" required /><button type="submit">Sign in</button><div class="message" id="login-message" role="alert"></div></form></section>
      <section id="shop-view" hidden><div id="products" class="products"><article class="product"><h3>Playwright hoodie</h3><p>Soft, green, and made for reliable test runs.</p><div class="price">$49.00</div><button type="button" id="add-product">Add Playwright hoodie</button></article><article class="product"><h3>TestearLA mug</h3><p>A companion for long assertion reviews.</p><div class="price">$15.00</div><button type="button" id="add-mug">Add TestearLA mug</button></article></div><div id="cart" class="cart"><h2>Your cart</h2><p id="cart-empty">Your cart is empty.</p><div id="cart-item" hidden>Playwright hoodie · $49.00</div><strong>Total: <span id="cart-total">$0.00</span></strong></div></section>
    </main>
    <script>
      const loginView = document.querySelector('#login-view'); const shopView = document.querySelector('#shop-view'); const form = document.querySelector('#login-form'); const cartItem = document.querySelector('#cart-item'); const cartEmpty = document.querySelector('#cart-empty'); const total = document.querySelector('#cart-total'); const count = document.querySelector('#cart-count');
      form.addEventListener('submit', (event) => { event.preventDefault(); if (document.querySelector('#username').value === 'demo_user' && document.querySelector('#password').value === 'demo_password') { loginView.hidden = true; shopView.hidden = false; document.title = 'Products · Workshop Shop'; } else document.querySelector('#login-message').textContent = 'Use the demo credentials from the context.'; });
      document.querySelector('#add-product').addEventListener('click', () => { cartItem.hidden = false; cartEmpty.hidden = true; total.textContent = '$49.00'; count.textContent = '1'; });
      document.querySelector('#add-mug').addEventListener('click', () => { cartItem.hidden = false; cartEmpty.hidden = true; total.textContent = '$15.00'; count.textContent = '1'; });
    </script>
  </body>
</html>
